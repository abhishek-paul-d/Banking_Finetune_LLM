name: eval-gate-and-deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      model_repo:
        description: "Hugging Face repo holding the candidate GGUF"
        default: "Abhishek-255/banking-triage-qwen3_5_4b-quantized"
      model_file:
        description: "GGUF path inside that repo (to prove the gate fails, use repo unsloth/Qwen3.5-4B-GGUF and file Qwen3.5-4B-Q4_K_M.gguf: the un-tuned base model)"
        default: "gguf/model-Q4_K_M.gguf"

env:
  MODEL_REPO: ${{ github.event.inputs.model_repo || 'Abhishek-255/banking-triage-qwen3_5_4b-quantized' }}
  MODEL_FILE: ${{ github.event.inputs.model_file || 'gguf/model-Q4_K_M.gguf' }}
  TOKENIZER_REPO: Qwen/Qwen3.5-4B      # public; the fine-tune uses the base tokenizer unchanged

jobs:
  unit-tests:
    # Fast, no model and no secrets: gate logic (good predictions pass, degraded ones fail) and gateway prompt check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements-ci.txt }
      - run: pip install -r requirements-ci.txt
      - run: python -m pytest -q tests

  eval-gate:
    needs: unit-tests
    # Fork PRs cannot read the HF_TOKEN secret, so the model eval only runs for branches in this repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements-ci.txt }
      - run: pip install -r requirements-ci.txt

      # llama.cpp on CPU. Built once and cached (bump the key suffix to rebuild from the newest llama.cpp).
      # GGML_NATIVE=OFF + AVX2 so the cached binary runs on any runner CPU.
      - name: Cache llama.cpp build
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: llama.cpp/build/bin
          key: llama-cpp-cpu-v1
      - name: Build llama.cpp (CPU)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B llama.cpp/build -DGGML_CUDA=OFF -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON \
                -DGGML_F16C=ON -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build --target llama-server -j"$(nproc)"

      - name: Cache model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.MODEL_REPO }}-${{ env.MODEL_FILE }}-${{ env.TOKENIZER_REPO }}
      - name: Download model and tokenizer
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download, snapshot_download
          path = hf_hub_download(os.environ["MODEL_REPO"], os.environ["MODEL_FILE"])
          tok = snapshot_download(os.environ["TOKENIZER_REPO"], allow_patterns=[
              "tokenizer*", "vocab.json", "merges.txt", "chat_template*", "config.json", "special_tokens_map.json"])
          open(os.environ["GITHUB_ENV"], "a").write(f"GGUF_PATH={path}\nTOK_PATH={tok}\n")
          print("model:", path, os.path.getsize(path) / 1e9, "GB")
          PY

      - name: Start llama-server (CPU)
        run: |
          llama.cpp/build/bin/llama-server -m "$GGUF_PATH" --alias banking --host 127.0.0.1 --port 8000 \
            -c 4096 -np 4 -t "$(nproc)" > server.log 2>&1 &
          for i in $(seq 1 150); do
            curl -sf localhost:8000/health && break
            kill -0 $! 2>/dev/null || { echo "server died"; tail -50 server.log; exit 1; }
            sleep 2
          done
          curl -sf localhost:8000/health || { tail -50 server.log; exit 1; }

      - name: Evaluate on the fixed 200-example slice
        run: |
          python -m src.eval.evaluate --model banking --test data/gate_slice.jsonl --tokenizer "$TOK_PATH" \
            --concurrency 4 --out results/eval.json --preds-out results/preds.jsonl --tag "$MODEL_REPO/$MODEL_FILE"

      - name: Gate
        run: python -m src.eval.gate --results results/eval.json --thresholds configs/gate.yaml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            results/
            server.log

  build-and-publish:
    needs: [unit-tests, eval-gate]      # publishing is blocked if the gate fails
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push gateway image to GHCR
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/triage-api:${{ github.sha }}
          docker build -f docker/Dockerfile.api -t "$IMAGE" .
          docker push "$IMAGE"
